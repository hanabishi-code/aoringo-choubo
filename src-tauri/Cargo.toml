[package]
name = "keiri-note"
version = "0.1.0"
description = "個人事業主向け複式簿記アプリ(オフライン)"
edition = "2021"

[lib]
name = "keiri_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
