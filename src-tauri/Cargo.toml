[package]
name = "keiri-note"
version = "0.1.0"
description = "個人事業主向け複式簿記アプリ(オフライン)"
edition = "2021"
license = "MIT"

[lib]
name = "keiri_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 書き出し先を Mac 標準の保存ダイアログで選ぶため(2026-09-28 ユーザー承認)。通信機能なし
tauri-plugin-dialog = "2"
